services:
  api:
    build:
      context: .
      target: runtime
    image: playwright-api-wrapper:local
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      # Local test stack. Production refuses the development API key, so the
      # default key in .env would stop the container on startup.
      NODE_ENV: development
      ALLOWED_TARGETS: http://localhost:4010,http://127.0.0.1:4010,http://fixture:4010
      # Chromium sandbox needs seccomp capabilities that CI service containers
      # often lack. The target allowlist is the primary control here.
      CHROMIUM_ARGS: --no-sandbox
    ports:
      - "3000:3000"
    shm_size: "1gb"
    init: true
    depends_on:
      fixture:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  fixture:
    profiles: ["test"]
    build:
      context: .
      target: runtime
    image: playwright-api-wrapper:local
    command: ["node", "dist/fixture/server.js"]
    environment:
      FIXTURE_HOST: 0.0.0.0
      FIXTURE_PORT: "4010"
    # Published so newman and Postman on the host reach the fixture as
    # http://127.0.0.1:4010, which matches the collection defaults.
    ports:
      - "127.0.0.1:4010:4010"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4010/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 6
