name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    uses: simpsonm09-projects/simpsonm09-repo-standard/.github/workflows/lint.yml@a3fa103205245dc7503cafd6c32004c1a637339d # repo-standard main
  aislop:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/simpsonm09-repo-standard/.github/workflows/aislop.yml@a3fa103205245dc7503cafd6c32004c1a637339d # repo-standard main
  security:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/simpsonm09-repo-standard/.github/workflows/security.yml@a3fa103205245dc7503cafd6c32004c1a637339d # repo-standard main
  standard:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
    uses: simpsonm09-projects/simpsonm09-repo-standard/.github/workflows/standard.yml@a3fa103205245dc7503cafd6c32004c1a637339d # repo-standard main
  coverage:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
    uses: simpsonm09-projects/simpsonm09-repo-standard/.github/workflows/coverage.yml@a3fa103205245dc7503cafd6c32004c1a637339d # repo-standard main

  test:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Build the container image
        run: docker build -t playwright-api-wrapper:ci .
