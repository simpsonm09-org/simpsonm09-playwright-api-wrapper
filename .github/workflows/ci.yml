name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.repository_owner == 'simpsonm09-org'
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/lint.yml@bbfbdab3f0d3ab3be423447c0a1dd18ee944b6cb # repo-standard main
  aislop:
    if: github.repository_owner == 'simpsonm09-org'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/aislop.yml@bbfbdab3f0d3ab3be423447c0a1dd18ee944b6cb # repo-standard main
  security:
    if: github.repository_owner == 'simpsonm09-org'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/security.yml@bbfbdab3f0d3ab3be423447c0a1dd18ee944b6cb # repo-standard main
  standard:
    if: github.repository_owner == 'simpsonm09-org'
    permissions:
      contents: read
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/standard.yml@bbfbdab3f0d3ab3be423447c0a1dd18ee944b6cb # repo-standard main

  test:
    if: github.repository_owner == 'simpsonm09-org'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Tests with coverage
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Build the container image
        run: docker build -t playwright-api-wrapper:ci .
      - name: Patch coverage
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/patch-coverage.mjs --lcov coverage/lcov.info --base "$BASE" --threshold 80
